name: CI/CD

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.22.3
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check format
        run: scripts/check_format.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.22.3
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get dependencies
        run: flutter pub get
      - name: Lint using flutter analyze
        run: flutter analyze
      - name: Assert that every file that should be public has been exported
        run: scripts/assert_export.sh

  pub-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.22.3
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run publish dry run
        run: flutter pub publish --dry-run

  test-flutter:
    name: Test Flutter
    needs: [ lint, format, pub-dry-run ]
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.22.3
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Get dependencies
        run: flutter pub get
      - name: Run all tests
        run: flutter test --reporter=expanded --coverage
      - name: Check coverage
        run: dart scripts/check_coverage.dart coverage/lcov.info
      - name: Generate HTML report
        run: genhtml coverage/lcov.info -o coverage/html
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-coverage-report
          path: coverage/html

  test-android:
    name: Test Android
    needs: [ lint, format, pub-dry-run ]
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.22.3
    timeout-minutes: 20
    env:
      GRADLE_VERSION: 8.7

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Gradle
        id: cache-gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ./example/android/ci-cache/gradle
            ./example/android/gradle/wrapper/gradle-wrapper.jar
            ./example/android/gradlew
          key: ${{ runner.os }}-cache-gradle-${{ env.GRADLE_VERSION }}
      - name: Get dependencies
        run: flutter pub get
      - name: Setup Gradle
        if: steps.cache-gradle.outputs.cache-hit != 'true'
        working-directory: ./example/android
        run: ../../scripts/setup_gradle.sh ${{ env.GRADLE_VERSION }}
      - name: Validate Gradle
        working-directory: ./example/android
        run: dart ../../scripts/check_gradle_version.dart
      - name: Run all tests and coverage
        working-directory: ./example/android
        run: ./gradlew :usercentrics_sdk:testDebugUnitTest :usercentrics_sdk:koverHtmlReportDebug
      - name: List coverage files
        working-directory: ./example
        run: find build -name "*.html" -o -name "index.html" | head -20
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-coverage-report
          path: example/build/usercentrics_sdk/reports/kover/htmlDebug

  test-ios:
    name: Test iOS (${{ matrix.build_system }})
    needs: [ lint, format, pub-dry-run ]
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_system: [ cocoapods, spm ]

    steps:
      - name: Setup code
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.2'
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
      - name: Enable Swift Package Manager
        if: matrix.build_system == 'spm'
        run: flutter config --enable-swift-package-manager
      - name: Get dependencies
        run: flutter pub get
      - name: Create stub GoogleService-Info.plist for CI
        run: |
          cat > example/ios/Runner/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>AIzaCI00000000000000000000000000000000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.placeholder.ci</string>
            <key>PROJECT_ID</key><string>placeholder-ci</string>
            <key>STORAGE_BUCKET</key><string>placeholder-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          EOF
      - name: Setup Pods
        if: matrix.build_system == 'cocoapods'
        working-directory: ./example/ios
        run: pod install
      - name: Run all tests
        id: run_ios_tests
        working-directory: ./example/ios
        run: ../../scripts/ios_unit_tests.sh
      - name: Extract iOS crash diagnostics on failure
        if: ${{ failure() }}
        working-directory: ./example/ios
        run: |
          set +e
          mkdir -p ci-ios-diagnostics
          xcrun xcresulttool get --legacy --path TestResults.xcresult --format json > ci-ios-diagnostics/xcresult-full.json
          xcrun xcresulttool export diagnostics --path TestResults.xcresult --output-path ci-ios-diagnostics/TestResultsDiagnostics
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path ci-ios-diagnostics/attachments
          cp ~/Library/Logs/DiagnosticReports/*.crash ci-ios-diagnostics/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*.ips ci-ios-diagnostics/ 2>/dev/null || true
          cp -R ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/CrashReporter ci-ios-diagnostics/CoreSimulatorCrashReporter 2>/dev/null || true
          set -e
      - name: Show coverage report
        if: ${{ always() }}
        working-directory: ./example/ios
        run: xcrun xccov view --report TestResults.xcresult
      - name: Upload iOS test results and crash diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-and-diagnostics-${{ matrix.build_system }}
          if-no-files-found: warn
          path: |
            example/ios/TestResults.xcresult
            example/ios/ci-ios-diagnostics

  build-android:
    name: Build Android Example
    needs: [ lint, format, pub-dry-run ]
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.22.3
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get dependencies
        run: flutter pub get
      - name: Build
        working-directory: ./example
        run: flutter build apk

  build-ios:
    name: Build iOS Example (${{ matrix.build_system }})
    needs: [ lint, format, pub-dry-run ]
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_system: [ cocoapods, spm ]

    steps:
      - name: Setup code
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.2'
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
      - name: Enable Swift Package Manager
        if: matrix.build_system == 'spm'
        run: flutter config --enable-swift-package-manager
      - name: Get dependencies
        run: flutter pub get
      - name: Create stub GoogleService-Info.plist for CI
        run: |
          cat > example/ios/Runner/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>AIzaCI00000000000000000000000000000000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.placeholder.ci</string>
            <key>PROJECT_ID</key><string>placeholder-ci</string>
            <key>STORAGE_BUCKET</key><string>placeholder-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          EOF
      - name: Build
        working-directory: ./example
        run: flutter build ios --debug --no-codesign --simulator

  # https://dart.dev/tools/pub/automated-publishing
  release:
    name: Release
    permissions:
      id-token: write # Required for flutter pub publish (OIDC automated publishing — cannot be removed)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ test-flutter, test-android, test-ios, build-android, build-ios ]
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.22.3
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate version
        run: dart scripts/check_release_version.dart ${{ github.ref }}
      - name: Set publishing token
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
      - name: Get dependencies
        run: flutter pub get
      - name: Publish
        run: flutter pub publish -f
      - name: Measure binary sizes
        continue-on-error: true
        run: ./scripts/measure_binary_sizes.sh --compare --output binary-sizes-flutter.json
      - name: Upload binary sizes artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-sizes-flutter
          path: binary-sizes-flutter.json
